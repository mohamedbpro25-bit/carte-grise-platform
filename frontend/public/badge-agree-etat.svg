<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 72" width="160" height="72">
  <!-- Shadow -->
  <rect x="2" y="2" width="156" height="68" rx="10" fill="#00000018"/>
  <!-- Card background -->
  <rect x="0" y="0" width="156" height="68" rx="10" fill="white"/>
  <!-- Left blue accent bar -->
  <rect x="0" y="0" width="6" height="68" rx="3" fill="#003189"/>
  <!-- Top tricolor stripe -->
  <rect x="6" y="0" width="50" height="5" fill="#003189"/>
  <rect x="56" y="0" width="50" height="5" fill="white"/>
  <rect x="106" y="0" width="50" height="5" rx="0" fill="#E1000F"/>
  <rect x="150" y="0" width="6" height="5" rx="3" fill="#E1000F"/>
  <!-- RF monogram circle -->
  <circle cx="32" cy="38" r="20" fill="#003189"/>
  <text x="32" y="44" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="16" font-weight="bold" fill="white">RF</text>
  <!-- Main text -->
  <text x="60" y="28" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#003189">Agréé par l'État</text>
  <text x="60" y="44" font-family="Arial, Helvetica, sans-serif" font-size="9.5" fill="#555555">République Française</text>
  <text x="60" y="58" font-family="Arial, Helvetica, sans-serif" font-size="8" fill="#888888">Conforme procédures officielles</text>
  <!-- Stars row -->
  <text x="60" y="7" font-family="Arial" font-size="5" fill="#E1000F">★ ★ ★ ★ ★</text>
</svg>
