## render.yaml — Plan Starter (toujours actif) + FreeSQLDatabase externe (pas de MySQL Render)
## Coût : ~7$/mois pour backend starter + ~7$/mois pour frontend starter + 5GB disk uploads
## Base de données : FreeSQLDatabase gratuite externe (sql7.freesqldatabase.com)

services:
  - type: web
    runtime: node
    name: certicarte-backend
    rootDir: backend
    plan: starter
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DB_TYPE
        value: mysql
      - key: DB_HOST
        value: sql7.freesqldatabase.com
      - key: DB_PORT
        value: 3306
      - key: DB_DATABASE
        value: sql7823235
      - key: DB_USERNAME
        value: sql7823235
      - key: DB_PASSWORD
        value: spiQTQBNxd
      - key: DB_SYNCHRONIZE
        value: false
      - key: JWT_SECRET
        generateValue: true
      - key: PAYMENTS_MODE
        value: mock
      - key: REQUIRE_EMAIL_VERIFICATION
        value: false
      - key: UPLOADS_DIR
        value: /opt/render/project/src/uploads
      - key: FRONTEND_URL
        value: https://certicarte-frontend.onrender.com
      - key: BACKEND_URL
        value: https://certicarte-backend.onrender.com
      - key: SIV_API_URL
        value: https://api.siv.gouv.fr/v1
      - key: SIV_API_KEY
        value: test
      - key: PLAQUE_API_URL
        value: https://api.siv.gouv.fr/v1
      - key: PLAQUE_API_KEY
        value: test
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        value: demo@certicarte.fr
      - key: SMTP_PASS
        value: app-password-placeholder
      - key: SMTP_FROM
        value: no-reply@certicarte.fr
      - key: STRIPE_SECRET_KEY
        value: sk_test_placeholder
    disk:
      name: certicarte-uploads
      mountPath: /opt/render/project/src/uploads
      sizeGB: 5

  - type: web
    runtime: node
    name: certicarte-frontend
    rootDir: frontend
    plan: starter
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: /api
      - key: BACKEND_HOSTPORT
        fromService:
          name: certicarte-backend
          type: web
          property: hostport
      - key: NEXT_PUBLIC_STRIPE_PUBLIC_KEY
        value: pk_test_placeholder